[project]
name = "ml-service"
version = "0.1.0"
description = "AI CyberShield FastAPI ML microservice"
readme = "README.md"
requires-python = "==3.11.*"
dependencies = [
    "fastapi>=0.115.0",
    "httpx2>=2.16.2",
    "joblib>=1.6.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "scikit-learn>=1.6.0",
    "slowapi>=0.1.9",
    "uvicorn[standard]>=0.32.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pip-audit>=2.8.0",
    "pytest>=8.3.0",
    "ruff>=0.17.5",
]

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  server:
    name: Backend Server (Node.js 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: server/package-lock.json
      - name: Install dependencies
        run: cd server && npm ci
      - name: Lint
        run: cd server && npm run lint
      - name: Test
        run: cd server && npm test

  client:
    name: Frontend Client (Vite + React)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: client/package-lock.json
      - name: Install dependencies
        run: cd client && npm ci
      - name: Lint
        run: cd client && npm run lint
      - name: Test
        run: cd client && npm test
      - name: Build
        env:
          VITE_API_URL: http://localhost:5000
          VITE_APP_ENV: production
        run: cd client && npm run build

  ml-service:
    name: ML Inference Microservice (FastAPI + uv)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.11
      - name: Install dependencies
        run: cd ml-service && uv sync --frozen
      - name: Lint
        run: cd ml-service && uv run ruff check .
      - name: Test
        run: cd ml-service && uv run pytest

  ml-training:
    name: ML Training Pipeline (Python 3.11 + uv)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.11
      - name: Install dependencies
        run: cd ml-training && uv sync --frozen
      - name: Lint
        run: cd ml-training && uv run ruff check .
      - name: Test
        run: cd ml-training && uv run pytest
